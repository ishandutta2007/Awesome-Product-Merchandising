<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Gradient Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .metric-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #38bdf8;
      }
      .metric-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 12px;
        fill: #94a3b8;
      }

      /* Animated Elements */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatCardReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes barGrow {
        0%, 100% { height: 35px; y: 45px; }
        50% { height: 60px; y: 20px; }
      }
      @keyframes barGrow2 {
        0%, 100% { height: 55px; y: 25px; }
        50% { height: 30px; y: 50px; }
      }
      @keyframes pulseCircle {
        0%, 100% { r: 4px; opacity: 0.6; }
        50% { r: 7px; opacity: 1; }
      }

      .pulse-orb {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-1 {
        animation: floatCard 6s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatCardReverse 5s ease-in-out infinite;
      }
      .bar-anim-1 {
        animation: barGrow 4s ease-in-out infinite;
      }
      .bar-anim-2 {
        animation: barGrow2 4.5s ease-in-out infinite;
      }
      .pulse-dot {
        animation: pulseCircle 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="150" cy="80" r="130" fill="#6366f1" filter="url(#glow)" class="pulse-orb" opacity="0.4" />
  <circle cx="1080" cy="180" r="160" fill="#0ea5e9" filter="url(#glow)" class="pulse-orb" opacity="0.3" />
  <circle cx="650" cy="320" r="140" fill="#a855f7" filter="url(#glow)" class="pulse-orb" opacity="0.25" />

  <!-- Background Grid Pattern -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Card 1: Boost & Bury Rule Simulation (Right Top) -->
  <g class="floating-card-1" transform="translate(860, 45)">
    <rect width="280" height="120" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="28" cy="30" r="5" fill="#10b981" class="pulse-dot" />
    <text x="44" y="34" class="metric-title">Searchandising AI</text>
    <text x="28" y="62" class="metric-sub">⚡ Boost Rule: Margin > 30%</text>
    <text x="28" y="82" class="metric-sub">🔻 Bury Rule: Out of Stock (SKU)</text>
    <!-- Mini Sparkline Graph -->
    <path d="M 180 95 Q 200 70, 220 85 T 260 65" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="260" cy="65" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Dynamic Card 2: Discovery Conversion Flow (Right Bottom) -->
  <g class="floating-card-2" transform="translate(860, 190)">
    <rect width="280" height="120" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="28" cy="30" r="5" fill="#a855f7" class="pulse-dot" />
    <text x="44" y="34" class="metric-title" fill="#818cf8">Discovery Performance</text>
    <!-- Bar charts with smooth dynamic height -->
    <g transform="translate(40, 25)">
      <rect x="0" y="45" width="16" height="35" rx="3" fill="#6366f1" class="bar-anim-1" />
      <rect x="25" y="25" width="16" height="55" rx="3" fill="#38bdf8" class="bar-anim-2" />
      <rect x="50" y="35" width="16" height="45" rx="3" fill="#a855f7" class="bar-anim-1" />
      <rect x="75" y="15" width="16" height="65" rx="3" fill="#ec4899" class="bar-anim-2" />
    </g>
    <text x="160" y="65" class="metric-sub">+34% Conversion</text>
    <text x="160" y="85" class="metric-sub">AOV Lift: +18.2%</text>
  </g>

  <!-- Main Foreground Content Area (Left / Center) -->
  <!-- Top Category Pill -->
  <g transform="translate(70, 48)">
    <rect width="260" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="16" cy="16" r="4" fill="#38bdf8" />
    <text x="28" y="21" class="tag-text">🛍️ E-COMMERCE &amp; PRODUCT DISCOVERY</text>
  </g>

  <!-- Title Heading -->
  <g transform="translate(70, 130)">
    <text class="title-text">
      Awesome <tspan fill="url(#accentGrad)">Product Merchandising</tspan>
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(70, 172)">
    <text class="subtitle-text">
      Curated ecosystem of enterprise searchandising suites &amp; open-source discovery engines.
    </text>
    <text class="subtitle-text" y="28">
      Boost rules, category visual sorting, AI semantic search, and personalization platforms.
    </text>
  </g>

  <!-- Interactive Tag Pills (Bottom) -->
  <g transform="translate(70, 260)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="145" height="36" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <text x="14" y="23" class="tag-text">🎯 Searchandising</text>

    <!-- Pill 2 -->
    <rect x="160" y="0" width="150" height="36" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
    <text x="174" y="23" class="tag-text">🚀 Boost &amp; Bury Rules</text>

    <!-- Pill 3 -->
    <rect x="325" y="0" width="155" height="36" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1" />
    <text x="339" y="23" class="tag-text">🔍 Semantic &amp; Visual AI</text>

    <!-- Pill 4 -->
    <rect x="495" y="0" width="155" height="36" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <text x="509" y="23" class="tag-text">🌐 Open Source Engines</text>
  </g>
</svg>
